apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato
  labels:
    app: zomato
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      containers:
      - name: zomato
        image: bpranayraj/zomato:build-13-f8af95e2d3967d70775de60df9d2b8a77a7c8fba
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
