apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato
  labels:
    app: zomato
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      containers:
      - name: zomato
        image: bpranayraj/zomato:build-14-f6f708f733ff6786954cf8b319ffa0eb609d6f7a
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
