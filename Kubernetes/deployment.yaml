# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato
  labels:
    app: zomato
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      containers:
        - name: zomato
          image: bpranayraj/zomato:build-16-b71cfc508bf3072f401afe5eabc6b8de7eb88e98
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
