name: Zomato (v1)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    # 1. Set up Java Environment
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # Standard open-source JDK
        java-version: '17'
        cache: 'maven'          # Caches dependencies to speed up self-hosted runs

    # 2. Build the Application (Generates the JAR)
    - name: Build with Maven
      run: mvn clean package -DskipTests=true

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build & Push Image
      run: |
        docker build -t bpranayraj/zomato:v1 .
        docker push bpranayraj/zomato:v1

    - name: Deploy BLUE to EKS
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/node-service.yaml
