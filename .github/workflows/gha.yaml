name: Zomato-complete projects

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      TMPDIR: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Pre-build disk cleanup while 2.8 GB is tight
      - name: Free Disk Space Before Build
        run: |
          rm -rf /tmp/npm-cache /tmp/trivy-cache "${{ runner.temp }}/*"
          docker system prune -af --volumes 2>/dev/null || true
          docker builder prune -af 2>/dev/null || true
          df -h / /tmp

      # 1. Setup Java 17 for SonarQube
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Setup Node.js 23 for NPM dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      # 3. SonarQube Analysis
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectName=zomato
            -Dsonar.projectKey=zomato

      # 4. SonarQube Quality Gate Check
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 5. Install NPM Dependencies (with cache redirected to /tmp and cleaned after)
      - name: Install NPM Dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund || npm install --no-audit --no-fund
          rm -rf /tmp/npm-cache ~/.npm

      # 6. Run Trivy File Scan
      - name: Run Trivy File Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: '.'
          format: 'table'
          output: 'trivy.txt'

      # 7. Remove Previous Local Zomato Images & Prune Cache Before Building
      - name: Clean Up Previous Local Images Before Build
        run: |
          OLD_IMAGES=$(docker images -q zomato "${{ secrets.DOCKERHUB_USERNAME }}/zomato" 2>/dev/null | sort -u)
          if [ -n "$OLD_IMAGES" ]; then
            docker rmi -f $OLD_IMAGES
          fi
          docker builder prune -af
          docker image prune -f

      # 8. Build, Tag (Unique Per-Run Tag + Latest), and Push Docker Image
      - name: Build, Tag, and Push Docker Image
        env:
          IMAGE_TAG: "build-${{ github.run_number }}-${{ github.sha }}"
        run: |
          docker build -t zomato .
          docker tag zomato "${{ secrets.DOCKERHUB_USERNAME }}/zomato:${IMAGE_TAG}"
          docker tag zomato "${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest"

          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/zomato:${IMAGE_TAG}"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest"

          # Remove local build/pushed images immediately after pushing to free /var/lib/docker & containerd
          docker rmi -f zomato "${{ secrets.DOCKERHUB_USERNAME }}/zomato:${IMAGE_TAG}" "${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest" 2>/dev/null || true
          docker builder prune -af

      # 9. Update Image Tag in Kubernetes Manifests for Argo CD (Push / Merge Only)
      - name: Update Kubernetes Manifest Image Tag for Argo CD
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          IMAGE_REPO: "${{ secrets.DOCKERHUB_USERNAME }}/zomato"
          IMAGE_TAG: "build-${{ github.run_number }}-${{ github.sha }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find Kubernetes -type f \( -name "*.yaml" -o -name "*.yml" \) -exec sed -i "s|${IMAGE_REPO}:[^\"'[:space:]]*|${IMAGE_REPO}:${IMAGE_TAG}|g" {} +

          if ! git diff --quiet; then
            git add Kubernetes/
            git commit -m "ci: update zomato image tag to ${IMAGE_TAG} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No Kubernetes manifest changes to commit."
          fi

      # 10. Clean Heavy Workspace Directories Before Email (Keeps trivy.txt intact for attachment)
      - name: Clean Heavy Build Artifacts Before Notification
        if: always()
        run: |
          rm -rf node_modules build dist .scannerwork /tmp/npm-cache ~/.cache/trivy 2>/dev/null || true

      # 11. Email Notification (Runs always)
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Build Status: ${{ job.status }} - ${{ github.job }}"
          to: bprk1996@gmail.com
          from: ${{ secrets.GMAIL_USER }}
          attachments: trivy.txt
          ignore_missing_attachments: true
          html_body: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
            </head>
            <body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1f2937;">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #f4f6f8; padding: 32px 16px;">
                <tr>
                  <td align="center">
                    <!-- Main Card -->
                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width: 560px; background-color: #ffffff; border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);">
                      
                      <!-- Header Banner -->
                      <tr>
                        <td style="background-color: #111827; padding: 24px 32px;">
                          <p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af;">
                            GitHub Actions Notification
                          </p>
                          <h1 style="margin: 6px 0 0 0; font-size: 20px; font-weight: 700; color: #ffffff;">
                            ${{ github.workflow }}
                          </h1>
                        </td>
                      </tr>

                      <!-- Body Content -->
                      <tr>
                        <td style="padding: 28px 32px;">
                          <!-- Dynamic Status Badge -->
                          <div style="margin-bottom: 24px;">
                            <span style="display: inline-block; padding: 6px 14px; font-size: 13px; font-weight: 700; border-radius: 9999px; background-color: ${{ job.status == 'success' && '#dcfce7' || '#fee2e2' }}; color: ${{ job.status == 'success' && '#166534' || '#991b1b' }}; text-transform: uppercase; letter-spacing: 0.05em;">
                              Status: ${{ job.status }}
                            </span>
                          </div>

                          <!-- Details Table -->
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border-collapse: collapse; margin-bottom: 28px;">
                            <tr>
                              <td style="padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; color: #6b7280; width: 35%;">
                                Repository
                              </td>
                              <td style="padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; font-weight: 600; color: #111827; text-align: right;">
                                ${{ github.repository }}
                              </td>
                            </tr>
                            <tr>
                              <td style="padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; color: #6b7280;">
                                Job Name
                              </td>
                              <td style="padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; font-weight: 600; color: #111827; text-align: right;">
                                ${{ github.job }}
                              </td>
                            </tr>
                            <tr>
                              <td style="padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; color: #6b7280;">
                                Build Number
                              </td>
                              <td style="padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size: 14px; font-weight: 600; color: #111827; text-align: right;">
                                #${{ github.run_number }}
                              </td>
                            </tr>
                            <tr>
                              <td style="padding: 12px 0; font-size: 14px; color: #6b7280;">
                                Branch
                              </td>
                              <td style="padding: 12px 0; font-size: 14px; font-weight: 600; color: #111827; text-align: right;">
                                ${{ github.ref_name }}
                              </td>
                            </tr>
                          </table>

                          <!-- Action Button -->
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                              <td align="center">
                                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" target="_blank" style="display: inline-block; background-color: #2563eb; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 24px; border-radius: 8px;">
                                  View Workflow Run
                                </a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- Footer -->
                      <tr>
                        <td style="background-color: #f9fafb; padding: 16px 32px; border-top: 1px solid #e5e7eb; text-align: center;">
                          <p style="margin: 0; font-size: 12px; color: #6b7280;">
                            Trivy scan report attached (if generated) • Automated CI/CD Alert
                          </p>
                        </td>
                      </tr>

                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

      # 12. Final Cleanup After Email (Removes trivy.txt and /tmp scratch files)
      - name: Final Cleanup After Notification
        if: always()
        run: |
          rm -f trivy.txt
          rm -rf /tmp/npm-cache "${{ runner.temp }}/*" 2>/dev/null || true
          df -h / /tmp
