name: CI/CD Pipeline - Self-Hosted Runner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Java 17 for SonarQube & Dependency-Check
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Setup Node.js 23 for NPM dependencies
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      # 3. SonarQube Analysis
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectName=zomato
            -Dsonar.projectKey=zomato

      # 4. SonarQube Quality Gate Check
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 5. Install NPM Dependencies
      - name: Install NPM Dependencies
        run: npm install

      # 6. OWASP Dependency-Check Scan
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'zomato'
          path: '.'
          format: 'XML'
          args: >
            --disableYarnAudit
            --disableNodeAudit

      # 7. Trivy File Scan (Requires Trivy installed on the self-hosted host, or use trivy-action)
      - name: Run Trivy File Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-dir: '.'
          format: 'table'
          output: 'trivy.txt'

      # 8. Build Docker Image
      - name: Build Docker Image
        run: docker build -t zomato .

      # 9. Login & Push to DockerHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and Push Docker Image
        run: |
          docker tag zomato ${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest

      # 10. Docker Scout Analysis
      - name: Run Docker Scout
        uses: docker/scout-action@v1
        with:
          command: 'quickview,cves,recommendations'
          image: ${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          sarif-file: 'docker-scout-results.sarif'

      # 11. Deploy to Local Container
      - name: Deploy to Container
        run: |
          # Stop and remove existing container if running to prevent port conflicts
          docker rm -f zomato || true
          docker run -d --name zomato -p 3000:3000 ${{ secrets.DOCKERHUB_USERNAME }}/zomato:latest

      # 12. Email Notification (Runs always)
      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Build Status: ${{ job.status }} - ${{ github.job }}"
          to: bprk1996@gmail.com
          from: ${{ secrets.GMAIL_USER }}
          html_body: |
            <html>
            <body>
                <div style="background-color: #FFA07A; padding: 10px; margin-bottom: 10px;">
                    <p style="color: white; font-weight: bold;">Repository: ${{ github.repository }}</p>
                </div>
                <div style="background-color: #90EE90; padding: 10px; margin-bottom: 10px;">
                    <p style="color: white; font-weight: bold;">Build Number: ${{ github.run_number }}</p>
                </div>
                <div style="background-color: #87CEEB; padding: 10px; margin-bottom: 10px;">
                    <p style="color: white; font-weight: bold;">Workflow Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}</p>
                </div>
                <p><b>Status:</b> ${{ job.status }}</p>
            </body>
            </html>
          attachments: trivy.txt
