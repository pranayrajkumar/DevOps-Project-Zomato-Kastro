name: Switch Between Versions

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Select Docker image version to deploy'
        required: true
        default: 'v1'
        type: choice
        options:
          - v1
          - v2
          - v3

env:
  IMAGE_NAME: bpranayraj/zomato
  IMAGE_TAG: ${{ github.event.inputs.image_tag || 'v1' }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Update Kubernetes Manifest Tag
      run: |
        # Safely replaces the image tag in your Kubernetes deployment file
        sed -i 's|image: ${{ env.IMAGE_NAME }}:.*|image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|g' Kubernetes/deployment.yaml

    - name: Deploy Zomato to EKS
      run: |
        kubectl apply -f Kubernetes/deployment.yaml
        kubectl apply -f Kubernetes/node-service.yaml
